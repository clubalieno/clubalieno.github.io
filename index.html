<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club Alieno</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
}

body {
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   PAGINA
===================================================== */

#intro {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =====================================================
   CERCHIO
===================================================== */

.circle-container {
    position: absolute;
    width: 360px;
    height: 360px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.circle {
    width: 100%;
    height: 100%;
}

.circle circle {
    fill: none;
    stroke: #000;
    stroke-width: 1.5;
    stroke-linecap: round;

    stroke-dasharray: 1131;
    stroke-dashoffset: 1131;

    animation: drawCircle 2.8s ease-out forwards;
}

@keyframes drawCircle {

    to {
        stroke-dashoffset: 0;
    }

}


/* =====================================================
   SCRITTA CLUB ALIENO
===================================================== */

.title {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: clamp(32px, 5vw, 76px);

    font-weight: 400;

    letter-spacing: 0.08em;

    white-space: nowrap;

    opacity: 0;

    animation:
        titleAppear 1.2s ease-out forwards;

    /*
       IMPORTANTE:
       la scritta parte praticamente insieme
       al disegno del cerchio
    */

    animation-delay: 0.25s;
}


/* La A che verrà rapita */

.alien-a {
    display: inline-block;
    position: relative;
}


/* =====================================================
   APPARIZIONE SCRITTA
===================================================== */

@keyframes titleAppear {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(0.96);
    }

    100% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1);
    }

}


/* =====================================================
   UFO
===================================================== */

.ufo {

    position: absolute;

    width: 180px;
    height: 90px;

    left: 50%;

    /*
       parte fuori dallo schermo
    */

    top: -180px;

    transform:
        translateX(-50%)
        scale(0.75);

    opacity: 0;

    z-index: 20;

    animation:
        ufoArrives 2.2s cubic-bezier(.22,.61,.36,1) forwards;

    /*
       L'UFO arriva DOPO la comparsa
       della scritta
    */

    animation-delay: 4.2s;
}


/* =====================================================
   CORPO UFO
===================================================== */

.ufo-body {

    position: absolute;

    width: 180px;
    height: 55px;

    left: 0;
    bottom: 0;

    background: #000;

    border-radius:
        50%
        50%
        45%
        45%;

}


/* =====================================================
   CUPOLA
===================================================== */

.ufo-dome {

    position: absolute;

    width: 72px;
    height: 38px;

    left: 54px;
    top: 0;

    background: #000;

    border-radius:
        70px
        70px
        0
        0;

}


/* =====================================================
   LINEA CENTRALE
===================================================== */

.ufo-line {

    position: absolute;

    width: 145px;
    height: 2px;

    left: 17px;
    top: 28px;

    background: #fff;

    opacity: 0.7;
}


/* =====================================================
   LUCE / FASCIO
===================================================== */

.beam {

    position: absolute;

    left: 50%;
    top: 78px;

    transform:
        translateX(-50%)
        perspective(300px)
        rotateX(0deg);

    width: 0;
    height: 0;

    border-left: 45px solid transparent;
    border-right: 45px solid transparent;
    border-top: 0 solid transparent;

    opacity: 0;

    z-index: -1;

    animation:
        beamAppear 0.8s ease-out forwards;

    animation-delay: 6.4s;
}


/* =====================================================
   ARRIVO UFO
===================================================== */

@keyframes ufoArrives {

    0% {

        top: -180px;

        opacity: 0;

        transform:
            translateX(-50%)
            scale(0.75)
            rotate(-4deg);
    }

    30% {

        opacity: 1;
    }

    75% {

        transform:
            translateX(-50%)
            scale(0.82)
            rotate(2deg);
    }

    100% {

        top: calc(50% - 145px);

        opacity: 1;

        transform:
            translateX(-50%)
            scale(0.82)
            rotate(0deg);
    }

}


/* =====================================================
   COMPARSA FASCIO
===================================================== */

@keyframes beamAppear {

    0% {

        opacity: 0;

        border-top:
            0 solid transparent;
    }

    100% {

        opacity: 0.15;

        border-top:
            170px solid #000;
    }

}


/* =====================================================
   RAPIMENTO DELLA A
===================================================== */

.alien-a {

    animation:
        abductA 2.2s cubic-bezier(.4,0,.2,1) forwards;

    animation-delay: 7.1s;
}


@keyframes abductA {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;
    }

    20% {

        transform:
            translateY(-8px)
            rotate(-3deg);

        opacity: 1;
    }

    60% {

        transform:
            translateY(-65px)
            rotate(5deg);

        opacity: 1;
    }

    100% {

        transform:
            translateY(-180px)
            rotate(12deg);

        opacity: 0;
    }

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 600px) {

    .circle-container {

        width: 280px;
        height: 280px;
    }

    .title {

        font-size: 30px;

        letter-spacing:
            0.06em;
    }

    .ufo {

        width: 140px;
        height: 70px;
    }

    .ufo-body {

        width: 140px;
        height: 43px;
    }

    .ufo-dome {

        width: 56px;
        height: 30px;

        left: 42px;
    }

    .ufo-line {

        width: 110px;
        left: 15px;
        top: 22px;
    }

}


/* =====================================================
   NASCONDE L'OVERFLOW DELL'ANIMAZIONE
===================================================== */

#intro {
    overflow: hidden;
}

</style>
</head>


<body>

<div id="intro">


    <!-- =================================================
         CERCHIO
    ================================================== -->

    <div class="circle-container">

        <svg
            class="circle"
            viewBox="0 0 360 360"
            xmlns="http://www.w3.org/2000/svg"
        >

            <circle
                cx="180"
                cy="180"
                r="180"
            />

        </svg>

    </div>


    <!-- =================================================
         SCRITTA
    ================================================== -->

    <div class="title">

        CLUB <span class="alien-a">A</span>LIENO

    </div>


    <!-- =================================================
         UFO
    ================================================== -->

    <div class="ufo">

        <div class="ufo-dome"></div>

        <div class="ufo-body"></div>

        <div class="ufo-line"></div>

        <div class="beam"></div>

    </div>


</div>

</body>
</html>
