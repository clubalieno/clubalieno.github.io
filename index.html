<!DOCTYPE html>
<html lang="it">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;

            max-width: 600px;
            line-height: 1.5;
            margin: 0;
        }

        .enter {
            margin-top: 50px;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

<body>

        <p>
